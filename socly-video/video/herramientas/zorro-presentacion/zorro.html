<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;800&display=swap');
html,body{margin:0;background:#F3EDE0}
#stage{position:absolute;left:0;top:0;width:576px;height:1024px;overflow:hidden;font-family:Inter,Arial,sans-serif;color:#15140F;
  background:radial-gradient(120% 70% at 50% 40%,#FBF4E4 0%,#F3EDE0 55%,#EBDFC8 100%)}
#world{position:absolute;inset:0;transform-origin:50% 52%}
.serif{font-family:'Instrument Serif',Georgia,serif;font-weight:400;letter-spacing:-.01em;line-height:1}
em{font-style:italic;color:#D2702A}
#halo{position:absolute;left:50%;top:400px;width:520px;height:520px;margin-left:-260px;border-radius:50%;
  background:radial-gradient(circle,rgba(227,135,63,.30) 0%,rgba(227,135,63,.10) 55%,rgba(227,135,63,0) 72%)}
.dot{position:absolute;border-radius:50%}
#fox{position:absolute;left:50%;bottom:130px;width:390px;height:533px;margin-left:-195px;transform-origin:50% 93%}
#fox img{position:absolute;inset:0;width:100%;height:100%}
#fox svg{position:absolute;inset:0;width:100%;height:100%}
.word{position:absolute;left:0;width:576px;text-align:center;font-family:'Instrument Serif',Georgia,serif;font-size:88px;line-height:1;opacity:0}
#cap{position:absolute;left:0;top:906px;width:576px;text-align:center;font-weight:800;font-size:37px;letter-spacing:.01em;text-transform:uppercase;line-height:1.15;padding:0 28px;box-sizing:border-box}
#cap .a{color:#D2702A}
#looks{position:absolute;left:22px;top:196px;width:190px;white-space:nowrap;opacity:0;transform-origin:0 0}
.tile{display:inline-flex;align-items:center;justify-content:center;width:68px;height:68px;margin:3px;border-radius:18px;background:#fff;box-shadow:0 6px 18px rgba(80,50,20,.16);font-size:38px}
.lbl{font-weight:600;font-size:15px;letter-spacing:.04em;margin-top:6px;color:#5C3A28}
.thumb{position:absolute;font-size:64px;opacity:0}
#stamp{white-space:nowrap;z-index:5;position:absolute;left:318px;top:330px;padding:10px 22px;border:5px solid #C0492B;border-radius:14px;color:#C0492B;font-weight:800;font-size:40px;letter-spacing:.06em;text-transform:uppercase;opacity:0;transform-origin:50% 50%}
#cta{position:absolute;left:0;width:576px;top:896px;text-align:center;opacity:0}
.pill{display:inline-block;padding:20px 40px;border-radius:999px;background:#15140F;color:#F4EFE4;font-weight:600;font-size:30px}
.sub{margin-top:14px;font-size:22px;font-weight:600;color:#5C3A28;letter-spacing:.02em}
.spark{position:absolute;width:26px;height:26px;opacity:0}
.spark:before,.spark:after{content:"";position:absolute;left:50%;top:50%;background:#E9B73F;border-radius:2px}
.spark:before{width:26px;height:5px;margin:-2.5px 0 0 -13px}
.spark:after{width:5px;height:26px;margin:-13px 0 0 -2.5px}
#brand{position:absolute;left:0;top:22px;width:576px;text-align:center;opacity:0;font-size:34px}
</style>
</head>
<body>
<div id="stage">
  <div id="world">
    <div id="halo"></div>
    <div id="dots"></div>
    <div id="brand" class="serif">Socly <em>Style</em></div>
    <div class="word" id="w0" style="top:70px">Mido</div>
    <div class="word" id="w1" style="top:154px">cuelgo</div>
    <div class="word" id="w2" style="top:238px">y <em>opino.</em></div>
    <div id="looks">
      <div><span class="tile">👕</span><span class="tile">👖</span></div>
      <div><span class="tile">🧥</span><span class="tile">👟</span></div>
      <div class="lbl">LOOKS CON TU ROPA</div>
    </div>
    <span class="thumb" id="t0">👍</span><span class="thumb" id="t1">👎</span><span class="thumb" id="t2">👍</span>
    <div id="stamp">Sin voto</div>
    <div id="fox">
      <img id="img" src="zorro.png" alt="">
      <svg viewBox="0 0 857 1171" id="mouthsvg">
        <ellipse id="patch" cx="330" cy="408" rx="58" ry="24" fill="#FFF5E0" opacity="0"/>
        <path id="mouth" d="" fill="#5A2E1E"/>
        <path id="tongue" d="" fill="#E58490"/>
      </svg>
    </div>
    <span class="spark" id="s0"></span><span class="spark" id="s1"></span><span class="spark" id="s2"></span><span class="spark" id="s3"></span>
  </div>
  <div id="cap"></div>
  <div id="cta"><span class="pill">Entra en Socly Style</span><div class="sub">Gratis, sin tarjeta</div></div>
</div>
<script src="datos.js"></script>
<script>
const D = window.DATA, FPS = D.fps, W = D.words;
const $ = (id) => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const norm = (s) => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]/g, '');
const find = (w, nth = 0) => { let k = 0; for (const x of W) if (norm(x.w) === w && k++ === nth) return x; return { s: 0, e: 0 }; };
const easeOut = (x) => 1 - Math.pow(1 - clamp(x), 3);
const back = (x) => { x = clamp(x); const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const lerp = (a, b, k) => a + (b - a) * k;
const pulse = (t, t0, len = 0.3) => (t >= t0 && t <= t0 + len ? 1 - (t - t0) / len : 0);

// Anclas en la voz
const A = {
  mido: find('mido'), cuelgo: find('cuelgo'), opino: find('opino'), cinta: find('cinta'), percha: find('percha'),
  ropa: find('ropa'), comb: find('combinaciones'), votan: find('votan'), cuenta: find('cuenta'),
  voto: find('voto'), zorro2: find('zorro', 1), entra: find('entra'), tarjeta: find('tarjeta'),
};
const END = Math.max(D.dur, A.tarjeta.e) + 0.9;

// Frases para los subtítulos: trozos de hasta 4 palabras, cortando en puntuación.
const chunks = [];
{ let cur = [];
  W.forEach((w, i) => { cur.push(i); const stop = /[.,]$/.test(w.w); if (cur.length >= 4 || stop || i === W.length - 1) { chunks.push(cur); cur = []; } });
}

// Fondo: puntitos que flotan
const dotsEl = $('dots');
const dots = [];
for (let i = 0; i < 16; i++) {
  const d = document.createElement('div'); d.className = 'dot';
  const s = 8 + (i * 7) % 18; d.style.width = d.style.height = s + 'px';
  d.style.background = ['#E3873F', '#E9B73F', '#F2C9A0', '#C9A57A'][i % 4]; d.style.opacity = '.45';
  dotsEl.appendChild(d); dots.push({ d, x: (i * 97) % 560, y: (i * 151) % 1000, s: 0.4 + (i % 5) * 0.15, p: i });
}

function mouthPath(m) {
  const cx = 330, cy = 410, rx = 22 + 14 * m, ry = 2 + 30 * m;
  // Boca abierta: semicírculo inferior con la línea de arriba casi recta.
  return `M ${cx - rx} ${cy} Q ${cx} ${cy - ry * 0.35} ${cx + rx} ${cy} Q ${cx + rx * 0.9} ${cy + ry * 1.5} ${cx} ${cy + ry * 1.55} Q ${cx - rx * 0.9} ${cy + ry * 1.5} ${cx - rx} ${cy} Z`;
}
function tonguePath(m) {
  const cx = 330, cy = 410, rx = 22 + 14 * m, ry = 2 + 30 * m;
  const y = cy + ry * 1.5;
  return `M ${cx - rx * 0.55} ${y - ry * 0.55} Q ${cx} ${y - ry * 1.0} ${cx + rx * 0.55} ${y - ry * 0.55} Q ${cx + rx * 0.4} ${y + 1} ${cx} ${y} Q ${cx - rx * 0.4} ${y + 1} ${cx - rx * 0.55} ${y - ry * 0.55} Z`;
}

function amp(t) {
  const x = t * FPS, i = Math.floor(x), f = x - i;
  const a = D.env[i] ?? 0, b = D.env[i + 1] ?? 0;
  return lerp(a, b, f);
}

function sparkAt(id, t, t0, x, y, len = 0.7) {
  const el = $(id), k = (t - t0) / len;
  if (k < 0 || k > 1) { el.style.opacity = 0; return; }
  const s = Math.sin(Math.PI * k);
  el.style.opacity = s; el.style.left = x + 'px'; el.style.top = y + 'px';
  el.style.transform = `scale(${0.4 + 1.3 * s}) rotate(${k * 120}deg)`;
}

function render(t) {
  // ---- cámara: zoom lento y dramático al principio, vuelve, y golpes en palabras clave
  let z = 1;
  z += 0.13 * easeOut(clamp(t / (A.cuelgo.s + 1.0))) * (1 - easeOut(clamp((t - A.cinta.s + 0.2) / 0.7)));
  [A.mido.s, A.cuelgo.s, A.opino.s].forEach((p) => { z += 0.035 * pulse(t, p, 0.25); });
  z += 0.04 * pulse(t, A.percha.s, 0.3) + 0.03 * pulse(t, A.entra.s, 0.3);
  $('world').style.transform = `scale(${z.toFixed(4)})`;

  // ---- fondo
  $('halo').style.transform = `scale(${1 + 0.04 * Math.sin(t * 2.2)})`;
  dots.forEach((o) => {
    const y = (o.y - t * 28 * o.s * 3 + 2000) % 1060 - 20;
    o.d.style.left = (o.x + 14 * Math.sin(t * o.s * 2 + o.p)) + 'px'; o.d.style.top = y + 'px';
  });
  $('brand').style.opacity = easeOut(clamp((t - 0.5) / 0.6)) * (1 - easeOut(clamp((t - A.cuelgo.s) / 0.4)));

  // ---- zorro: entrada con rebote, respiración, vaivén y habla
  const a = amp(t);
  const inK = clamp(t / 0.7);
  const drop = (1 - easeOut(inK)) * -520;
  const sq = inK >= 1 ? 0 : Math.sin(inK * Math.PI * 3) * (1 - inK) * 0.14;       // squash & stretch al caer
  const land = pulse(t, 0.55, 0.3) * 0.08;
  const breathe = 0.014 * Math.sin(t * 2 * Math.PI * 0.8);
  let sway = 1.4 * Math.sin(t * 2 * Math.PI * 0.45);
  // Gestos: se inclina al decir «opino», se encoge de hombros con «yo no voto», se agacha al llamar
  sway += -5 * pulse(t, A.opino.s, 0.5) + 4 * pulse(t, A.percha.s, 0.4);
  const shrug = clamp((t - A.voto.s + 0.9) / 0.25) * (1 - clamp((t - A.voto.s - 0.7) / 0.35));
  sway += 6 * Math.sin(shrug * Math.PI * 2) * shrug;
  const bob = -a * 9 - 10 * shrug;
  const sx = 1 + breathe + sq - land + a * 0.012, sy = 1 - breathe - sq + land + a * 0.02;
  $('fox').style.transform = `translateY(${(drop + bob).toFixed(1)}px) rotate(${sway.toFixed(2)}deg) scale(${sx.toFixed(4)},${sy.toFixed(4)})`;
  $('fox').style.opacity = clamp(t / 0.12);

  // ---- boca
  const talking = a > 0.04 && t < D.dur;
  const m = talking ? clamp(a * 1.1, 0.12, 1) : 0;
  $('patch').setAttribute('opacity', talking ? 1 : 0);
  $('mouth').setAttribute('d', talking ? mouthPath(m) : '');
  $('tongue').setAttribute('d', talking ? tonguePath(m) : '');

  // ---- «Mido / cuelgo / y opino.»
  [[A.mido, 'w0'], [A.cuelgo, 'w1'], [A.opino, 'w2']].forEach(([w, id], i) => {
    const el = $(id), k = back((t - w.s + 0.05) / 0.35);
    const gone = easeOut(clamp((t - A.cinta.s + 0.1) / 0.4));
    el.style.opacity = clamp((t - w.s + 0.05) / 0.12) * (1 - gone);
    el.style.transform = `translateY(${(1 - k) * 40 - gone * 30}px) scale(${0.6 + 0.4 * k}) rotate(${(i - 1) * 2.5}deg)`;
    el.style.color = i === 0 ? '#15140F' : i === 1 ? '#C9791F' : '#15140F';
  });

  // ---- destellos en la cinta y la percha (coordenadas dentro de la imagen escalada)
  sparkAt('s0', t, A.cinta.s, 205, 640, 0.8);
  sparkAt('s1', t, A.cinta.s + 0.15, 235, 695, 0.7);
  sparkAt('s2', t, A.percha.s, 318, 628, 0.8);
  sparkAt('s3', t, A.percha.s + 0.15, 346, 668, 0.7);

  // ---- «Looks con tu ropa»
  const lk = $('looks');
  const lin = back((t - A.ropa.s + 0.1) / 0.4), lout = easeOut(clamp((t - A.votan.s + 0.2) / 0.35));
  lk.style.opacity = clamp((t - A.ropa.s + 0.1) / 0.1) * (1 - lout);
  lk.style.transform = `scale(${lin}) rotate(-3deg)`;

  // ---- pulgares que suben
  [['t0', 0, 50, 700], ['t1', 0.35, 450, 660], ['t2', 0.7, 80, 560]].forEach(([id, off, x, y]) => {
    const el = $(id), k = (t - (A.votan.s + off)) / 1.3;
    if (k < 0 || k > 1) { el.style.opacity = 0; return; }
    el.style.opacity = Math.sin(Math.PI * Math.min(1, k * 1.2));
    el.style.left = x + 'px'; el.style.top = (y - 150 * k) + 'px';
    el.style.transform = `scale(${0.6 + 0.6 * back(k * 3)}) rotate(${(x < 200 ? -1 : 1) * 12 * Math.sin(k * 6)}deg)`;
  });

  // ---- sello «Sin voto» (el chiste)
  const st = $('stamp'), sk = back((t - (A.voto.s + 0.25)) / 0.3);
  const sOut = easeOut(clamp((t - A.entra.s + 0.25) / 0.3));
  st.style.opacity = clamp((t - (A.voto.s + 0.25)) / 0.08) * (1 - sOut);
  st.style.transform = `scale(${1.6 - 0.6 * sk}) rotate(-9deg)`;

  // ---- subtítulos palabra a palabra
  let html = '';
  for (const c of chunks) {
    const s = W[c[0]].s, e = W[c[c.length - 1]].e;
    if (t >= s - 0.04 && t <= e + 0.28) {
      html = c.map((i) => (t >= W[i].s - 0.02 && t <= W[i].e + 0.06 ? `<span class="a">${W[i].w}</span>` : W[i].w)).join(' ');
      break;
    }
  }
  const capEl = $('cap');
  if (capEl.dataset.h !== html) { capEl.innerHTML = html; capEl.dataset.h = html; }
  capEl.style.opacity = t > A.entra.s - 0.1 ? 0 : 1;

  // ---- botón final
  const cta = $('cta'), ck = back((t - A.entra.s) / 0.5);
  cta.style.opacity = clamp((t - A.entra.s) / 0.15);
  cta.style.transform = `translateY(${(1 - ck) * 60}px) scale(${0.8 + 0.2 * ck})`;
}

window.END = END;
Promise.all([document.fonts.ready, $('img').decode()]).then(() => { window.loaded = true; });
render(0);
</script>
</body>
</html>
