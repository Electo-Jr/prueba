<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@500;800&display=swap');
html,body{margin:0;background:transparent}
#stage{position:absolute;left:0;top:0;width:576px;height:1024px;overflow:hidden;background:transparent;font-family:Inter,Arial,sans-serif}
#dim{position:absolute;left:32px;top:32px;width:512px;height:869px;border-radius:47px;background:#15140F;opacity:0}
.fox{position:absolute;left:0;top:0;transform-origin:50% 100%;opacity:0}
.fox img{position:absolute;left:0;top:0;width:100%;height:100%;opacity:0}
.fox svg{position:absolute;left:0;top:0;width:100%;height:100%}
#shadow{position:absolute;height:14px;border-radius:50%;background:rgba(0,0,0,.35);filter:blur(4px);opacity:0}
#tape{position:absolute;height:15px;transform-origin:0 50%;opacity:0;border-radius:3px;
  background:repeating-linear-gradient(90deg,#F2C14E 0 14px,#C98E1D 14px 16px);box-shadow:0 2px 8px rgba(0,0,0,.4)}
#ring{position:absolute;width:56px;height:56px;margin:-28px 0 0 -28px;border:4px solid #F2C14E;border-radius:50%;opacity:0}
#cap{position:absolute;left:0;top:918px;width:576px;text-align:center;font-weight:800;font-size:29px;letter-spacing:.01em;text-transform:uppercase;line-height:1.1;color:#F4EFE4;padding:0 30px;box-sizing:border-box;text-shadow:0 2px 0 rgba(0,0,0,.55),0 0 10px rgba(0,0,0,.5)}
#cap .a{color:#F2C14E}
#kick{position:absolute;left:0;top:50px;width:576px;text-align:center;opacity:0}
#kick span{display:inline-block;padding:9px 20px;border-radius:999px;background:rgba(21,20,15,.78);color:#F4EFE4;font-weight:800;font-size:17px;letter-spacing:.08em;text-transform:uppercase;border:1.5px solid rgba(242,193,78,.7)}
#hook{position:absolute;left:0;top:300px;width:576px;text-align:center;font-family:'Instrument Serif',Georgia,serif;font-size:66px;line-height:1.02;color:#F4EFE4;opacity:0;text-shadow:0 3px 18px rgba(0,0,0,.6)}
#hook em{color:#F2C14E}
#stamp{position:absolute;left:150px;top:300px;padding:10px 22px;border:5px solid #E2573B;border-radius:14px;color:#E2573B;background:rgba(21,20,15,.55);font-weight:800;font-size:40px;letter-spacing:.06em;text-transform:uppercase;opacity:0;white-space:nowrap;z-index:5}
#cta{position:absolute;left:0;width:576px;top:290px;text-align:center;opacity:0}
.pill{display:inline-block;padding:18px 36px;border-radius:999px;background:#F4EFE4;color:#15140F;font-weight:800;font-size:27px}
.sub{margin-top:12px;font-size:20px;font-weight:800;color:#F4EFE4;letter-spacing:.04em;text-shadow:0 2px 10px rgba(0,0,0,.6)}
#chip{position:absolute;left:0;width:576px;top:230px;text-align:center;opacity:0}
#chip span{display:inline-block;padding:10px 22px;border-radius:999px;background:#F2C14E;color:#15140F;font-weight:800;font-size:19px;letter-spacing:.04em;text-transform:uppercase}
</style>
</head>
<body>
<div id="stage">
  <div id="dim"></div>
  <div id="hook">Tu armario <em>miente</em></div>
  <div id="kick"><span id="kickt"></span></div>
  <div id="chip"><span>Prueba gratis</span></div>
  <div id="stamp">Sin voto</div>
  <div id="tape"></div><div id="ring"></div>
  <div id="shadow"></div>
  <div class="fox" id="fox">
    <img id="p_saluda" src="zorro-saluda.png"><img id="p_senala" src="zorro-senala.png"><img id="p_presenta" src="zorro-presenta.png">
    <svg viewBox="0 0 985 1183">
      <ellipse id="patch" cx="458" cy="421" rx="58" ry="24" fill="#FFF5E0" opacity="0"/>
      <path id="mouth" d="" fill="#5A2E1E"/><path id="tongue" d="" fill="#E58490"/>
    </svg>
  </div>
  <div id="cta"><span class="pill">Entra en Socly Style</span><div class="sub">Gratis, sin tarjeta</div></div>
  <div id="cap"></div>
</div>
<script src="../datos.js"></script>
<script>
const D = window.DATA, FPS = D.fps, W = D.words;
const $ = (id) => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const easeIO = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const easeOut = (x) => 1 - Math.pow(1 - clamp(x), 3);
const back = (x) => { x = clamp(x); const c = 1.8; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const norm = (s) => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]/g, '');
const find = (w, n = 0) => { let k = 0; for (const x of W) if (norm(x.w) === w && k++ === n) return x; return { s: 0, e: 0 }; };
const A = { cinta: find('cinta'), cuelgo: find('cuelgo'), gratis: find('gratis'), voto: find('voto'), zorro: find('zorro'), entra: find('entra') };
const B = [0, 3.8, 8.3, 12.5, 18.7, 22.4, 27.6];       // cortes de escena (igual que escenas.json)
const END = B[B.length - 1];

// Tamaño del zorro (alto, en px css) y esquinas. La pantalla ocupa x 32..544, y 32..901; los subtítulos van debajo.
const BASE_Y = 893, SMALL = 240, BIG = 470;
const R = { x: 576 - 22 - SMALL * 0.416, y: BASE_Y, h: SMALL }, L = { x: 22 + SMALL * 0.416, y: BASE_Y, h: SMALL };
// Fotogramas clave del zorro: t, x (centro), y (pies), h, pose, flip (el brazo apunta hacia dentro de la pantalla)
const K = [
  { t: 0.0, x: 288, y: -300, h: BIG, pose: 'senala', flip: false },
  { t: 0.55, x: 288, y: 905, h: BIG, pose: 'senala', flip: false, land: true },
  { t: 2.7, x: 288, y: 905, h: BIG, pose: 'senala', flip: false },
  { t: 3.4, x: R.x, y: R.y, h: R.h, pose: 'presenta', flip: false, jump: 70 },
  { t: 5.3, x: R.x, y: R.y, h: R.h, pose: 'presenta', flip: false },
  { t: 5.9, x: L.x, y: L.y, h: L.h, pose: 'senala', flip: true, jump: 80 },
  { t: 8.1, x: L.x, y: L.y, h: L.h, pose: 'senala', flip: true },
  { t: 8.8, x: R.x, y: R.y, h: R.h, pose: 'senala', flip: false, jump: 80 },
  { t: 10.0, x: R.x, y: R.y, h: R.h, pose: 'senala', flip: false },
  { t: 10.2, x: R.x, y: R.y, h: R.h, pose: 'saluda', flip: false },
  { t: 12.0, x: R.x, y: R.y, h: R.h, pose: 'saluda', flip: false },
  { t: 12.8, x: L.x, y: L.y, h: L.h, pose: 'presenta', flip: true, jump: 80 },
  { t: 18.3, x: L.x, y: L.y, h: L.h, pose: 'presenta', flip: true },
  { t: 19.0, x: R.x, y: R.y, h: R.h, pose: 'senala', flip: false, jump: 70 },
  { t: 22.0, x: R.x, y: R.y, h: R.h, pose: 'senala', flip: false },
  { t: 22.9, x: 288, y: 975, h: 480, pose: 'saluda', flip: false, jump: 60 },
  { t: 99, x: 288, y: 975, h: 480, pose: 'saluda', flip: false },
];
function foxState(t) {
  let i = 0; while (i < K.length - 2 && t >= K[i + 1].t) i++;
  const a = K[i], b = K[i + 1];
  // La pose cambia al llegar al fotograma clave; la posición se mueve entre uno y otro.
  const moving = b.t - a.t > 0.01 && (a.x !== b.x || a.y !== b.y || a.h !== b.h);
  const k = clamp((t - a.t) / (b.t - a.t));
  const e = moving ? easeIO(k) : 0;
  const s = { x: lerp(a.x, b.x, e), y: lerp(a.y, b.y, e), h: lerp(a.h, b.h, e), pose: k < 0.35 && moving ? a.pose : b.pose, flip: k < 0.35 && moving ? a.flip : b.flip, air: 0, sq: 0 };
  if (moving && b.jump) { s.air = Math.sin(Math.PI * k) * b.jump; s.sq = k < 0.12 ? -(1 - k / 0.12) * 0.1 : k > 0.88 ? (1 - (1 - k) / 0.12) * 0.12 * 0 + Math.sin((k - 0.88) / 0.12 * Math.PI) * 0.1 : 0.05 * Math.sin(Math.PI * k); }
  if (a.land && !moving) { const d = clamp((t - a.t) / 0.5); s.sq = Math.sin(d * Math.PI * 2) * (1 - d) * 0.14; }
  return s;
}
function amp(t) { const x = t * FPS, i = Math.floor(x); return lerp(D.env[i] ?? 0, D.env[i + 1] ?? 0, x - i); }
function mouthPaths(m) {
  const cx = 458, cy = 424, rx = 24 + 15 * m, ry = 2 + 32 * m;
  return [
    `M ${cx - rx} ${cy} Q ${cx} ${cy - ry * 0.35} ${cx + rx} ${cy} Q ${cx + rx * 0.9} ${cy + ry * 1.5} ${cx} ${cy + ry * 1.55} Q ${cx - rx * 0.9} ${cy + ry * 1.5} ${cx - rx} ${cy} Z`,
    `M ${cx - rx * 0.55} ${cy + ry} Q ${cx} ${cy + ry * 0.5} ${cx + rx * 0.55} ${cy + ry} Q ${cx + rx * 0.4} ${cy + ry * 1.5} ${cx} ${cy + ry * 1.5} Q ${cx - rx * 0.4} ${cy + ry * 1.5} ${cx - rx * 0.55} ${cy + ry} Z`,
  ];
}

// Subtítulos: trozos de hasta 4 palabras, cortando en puntuación
const chunks = []; { let cur = []; W.forEach((w, i) => { cur.push(i); if (cur.length >= 4 || /[.,:]$/.test(w.w) || i === W.length - 1) { chunks.push(cur); cur = []; } }); }

const KICK = [null, null, ['Sube tu ropa', 4.6, 8.3], ['Looks con tu ropa', 8.6, 12.5], ['Vista puesta', 12.9, 18.7], ['Tus amigos votan sin cuenta', 19.0, 22.4]];

function render(t) {
  const st = $('stage');
  // atenuar la pantalla en el gancho y en el cierre
  const dim = Math.max(0.6 * (1 - clamp((t - 2.6) / 0.6)), 0.6 * clamp((t - 22.5) / 0.5));
  $('dim').style.opacity = dim;

  // zorro
  const f = foxState(t);
  const fox = $('fox'), h = f.h, w = h * (985 / 1183);
  const breathe = 1 + 0.012 * Math.sin(t * 5.2), a = amp(t);
  let sway = 1.2 * Math.sin(t * 2.6);
  // «Yo no voto»: se encoge de hombros (se hunde y se ladea)
  const sh = clamp((t - (A.voto.s + 0.5)) / 0.3) * (1 - clamp((t - (A.voto.s + 1.7)) / 0.4));
  sway += 7 * Math.sin(sh * Math.PI * 2) * sh;
  fox.style.width = w + 'px'; fox.style.height = h + 'px';
  fox.style.left = (f.x - w / 2) + 'px'; fox.style.top = (f.y - h - f.air) + 'px';
  fox.style.opacity = t > 0.02 ? 1 : 0;
  fox.style.transform = `scaleX(${(f.flip ? -1 : 1) * (1 - f.sq * 0.6 + a * 0.012) * (1 / breathe)}) scaleY(${(1 + f.sq + a * 0.02 - sh * 0.04) * breathe}) rotate(${sway * (f.flip ? -1 : 1)}deg)`;
  for (const p of ['saluda', 'senala', 'presenta']) $('p_' + p).style.opacity = f.pose === p ? 1 : 0;
  const sd = $('shadow'); sd.style.width = w * 0.62 + 'px'; sd.style.left = (f.x - w * 0.31) + 'px'; sd.style.top = (f.y - 6) + 'px'; sd.style.opacity = f.y > 0 ? Math.max(0, 0.9 - f.air / 90) : 0;

  // boca (solo con la pose de cara y mientras suena la voz)
  const talking = a > 0.05 && t < D.dur;
  const m = talking ? clamp(a * 1.1, 0.12, 1) : 0;
  const [mp, tp] = mouthPaths(m);
  $('patch').setAttribute('opacity', talking ? 1 : 0);
  $('mouth').setAttribute('d', talking ? mp : ''); $('tongue').setAttribute('d', talking ? tp : '');

  // gancho: «Tu armario miente»
  const hk = $('hook'), hin = back((t - 0.5) / 0.4), hout = easeOut(clamp((t - 3.3) / 0.4));
  hk.style.opacity = clamp((t - 0.45) / 0.1) * (1 - hout);
  hk.style.transform = `scale(${0.7 + 0.3 * hin}) translateY(${(1 - hin) * 30}px)`;

  // rótulos de cada escena
  let kt = null, ka = 0;
  for (const k of KICK) if (k && t >= k[1] && t <= k[2]) { kt = k[0]; ka = Math.min(easeOut((t - k[1]) / 0.25), 1 - easeOut(clamp((t - k[2] + 0.25) / 0.25))); }
  if (kt) $('kickt').textContent = kt;
  $('kick').style.opacity = ka; $('kick').style.transform = `translateY(${(1 - ka) * -14}px)`;

  // cinta métrica: sale del zorro y mide la prenda («yo la mido. Con la cinta.»)
  const tp0 = A.cinta.s - 0.2, tape = $('tape'), ring = $('ring');
  const tk = clamp((t - tp0) / 0.55), tOut = clamp((t - (A.cinta.e + 0.5)) / 0.35);
  if (t >= tp0 && tOut < 1) {
    const sx = L.x + 18, sy = L.y - L.h * 0.38, tx = 300, ty = 560;
    const len = Math.hypot(tx - sx, ty - sy) * easeOut(tk) * (1 - tOut), ang = Math.atan2(ty - sy, tx - sx);
    tape.style.opacity = 1; tape.style.left = sx + 'px'; tape.style.top = (sy - 7) + 'px'; tape.style.width = len + 'px'; tape.style.transform = `rotate(${ang}rad)`;
    const pk = clamp((t - (tp0 + 0.55)) / 0.5);
    ring.style.opacity = (1 - tOut) * Math.sin(Math.PI * Math.min(1, pk * 1.0 + 0.0)); ring.style.left = tx + 'px'; ring.style.top = ty + 'px';
    ring.style.transform = `scale(${0.5 + pk * 1.3})`;
  } else { tape.style.opacity = 0; ring.style.opacity = 0; }

  // «Prueba gratis»
  const ck = $('chip'); ck.style.opacity = clamp((t - A.gratis.s + 0.1) / 0.15) * (1 - clamp((t - 18.6) / 0.2));
  ck.style.transform = `scale(${0.8 + 0.2 * back((t - A.gratis.s + 0.1) / 0.35)})`;

  // «Sin voto»
  const so = $('stamp'), sk = back((t - (A.voto.s + 0.9)) / 0.28);
  so.style.opacity = clamp((t - (A.voto.s + 0.9)) / 0.06) * (1 - clamp((t - 22.4) / 0.2));
  so.style.transform = `scale(${1.7 - 0.7 * sk}) rotate(-8deg)`;

  // subtítulos
  let html = '';
  for (const c of chunks) { const s = W[c[0]].s, e = W[c[c.length - 1]].e; if (t >= s - 0.04 && t <= e + 0.28) { html = c.map((i) => (t >= W[i].s - 0.02 && t <= W[i].e + 0.08 ? `<span class="a">${W[i].w}</span>` : W[i].w)).join(' '); break; } }
  const cap = $('cap'); if (cap.dataset.h !== html) { cap.innerHTML = html; cap.dataset.h = html; }
  cap.style.opacity = t > A.entra.s - 0.05 ? 0 : 1;

  // cierre
  const cta = $('cta'), ck2 = back((t - (A.entra.s + 0.1)) / 0.45);
  cta.style.opacity = clamp((t - (A.entra.s + 0.1)) / 0.12);
  cta.style.transform = `translateY(${(1 - ck2) * 50}px) scale(${0.85 + 0.15 * ck2})`;
}
window.END = END;
Promise.all([document.fonts.ready, ...['p_saluda', 'p_senala', 'p_presenta'].map((i) => $(i).decode())]).then(() => { window.loaded = true; });
render(0);
</script>
</body>
</html>
